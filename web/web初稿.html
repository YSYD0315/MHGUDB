<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MHGU Database</title>
<style>
:root {
  --bg: #0f1419;
  --bg-card: #1a2029;
  --bg-hover: #232b36;
  --bg-active: #2a3441;
  --border: #2d3748;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --accent: #f59e0b;
  --accent-hover: #fbbf24;
  --danger: #ef4444;
  --success: #10b981;
  --info: #3b82f6;
  --sidebar-w: 240px;
  --header-h: 56px;
  --radius: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --transition: 0.2s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "Noto Sans JP", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Layout */
.app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  transition: transform var(--transition);
}
.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--header-h);
}
.sidebar-header .logo {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: #000;
}
.sidebar-header h1 { font-size: 16px; font-weight: 600; }
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.nav-section { margin-bottom: 8px; }
.nav-section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  padding: 8px 12px 4px;
  font-weight: 600;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 14px;
  transition: all var(--transition);
  text-decoration: none;
  user-select: none;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--bg-active); color: var(--accent); font-weight: 500; }
.nav-item .icon { width: 20px; text-align: center; font-size: 16px; }
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.lang-select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
}

/* Main */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
.header {
  height: var(--header-h);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.menu-btn {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--text-dim);
}
.breadcrumb a { color: var(--text-dim); text-decoration: none; }
.breadcrumb a:hover { color: var(--accent); }
.breadcrumb .sep { color: var(--text-muted); }
.header-spacer { flex: 1; }
.search-box {
  position: relative;
  width: 280px;
}
.search-box input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px 6px 32px;
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  transition: border-color var(--transition);
}
.search-box input:focus { border-color: var(--accent); }
.search-box .search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
}
.search-results {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-height: 400px;
  overflow-y: auto;
  box-shadow: var(--shadow);
  display: none;
  z-index: 200;
}
.search-results.show { display: block; }
.search-result-item {
  padding: 8px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: var(--bg-hover); }
.search-result-item .cat-badge {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--bg-active);
  color: var(--text-dim);
  white-space: nowrap;
}
.search-no-result {
  padding: 16px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

/* Content */
.content {
  flex: 1;
  padding: 24px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}

/* Page title */
.page-title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.page-title .icon { font-size: 28px; }

/* Cards / Grid */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  transition: border-color var(--transition);
}
.card:hover { border-color: var(--text-muted); }

.grid {
  display: grid;
  gap: 16px;
}
.grid-2 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

/* List */
.list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  text-decoration: none;
  color: var(--text);
}
.list-item:hover { background: var(--bg-hover); border-color: var(--accent); }
.list-item .item-icon {
  width: 40px; height: 40px;
  background: var(--bg-active);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.list-item .item-info { flex: 1; min-width: 0; }
.list-item .item-name { font-weight: 500; font-size: 14px; }
.list-item .item-desc { font-size: 12px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item .item-meta { font-size: 12px; color: var(--text-muted); text-align: right; flex-shrink: 0; }

/* Filters */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
  align-items: center;
}
.filter-btn {
  padding: 5px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  transition: all var(--transition);
}
.filter-btn:hover { border-color: var(--text-muted); color: var(--text); }
.filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 500; }
.filter-input {
  padding: 5px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  font-size: 12px;
  outline: none;
}
.filter-input:focus { border-color: var(--accent); }

/* Table */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th, td {
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
th {
  background: var(--bg-active);
  font-weight: 600;
  color: var(--text-dim);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  position: sticky;
  top: 0;
}
tr:hover td { background: var(--bg-hover); }
tr:last-child td { border-bottom: none; }

/* Detail page */
.detail-header {
  display: flex;
  gap: 20px;
  margin-bottom: 24px;
  align-items: flex-start;
}
.detail-icon {
  width: 80px; height: 80px;
  background: var(--bg-active);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
  flex-shrink: 0;
}
.detail-title { font-size: 28px; font-weight: 700; }
.detail-subtitle { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
.detail-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--bg-active);
  color: var(--text-dim);
}
.tag.fire { background: #7f1d1d; color: #fca5a5; }
.tag.water { background: #1e3a5f; color: #93c5fd; }
.tag.thunder { background: #713f12; color: #fde047; }
.tag.ice { background: #164e63; color: #a5f3fc; }
.tag.dragon { background: #4a1d6e; color: #d8b4fe; }

.section {
  margin-bottom: 24px;
}
.section-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Stats */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
.stat-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  text-align: center;
}
.stat-value { font-size: 24px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* Weakness */
.weakness-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.weakness-label { width: 60px; font-size: 12px; color: var(--text-dim); }
.weakness-track {
  flex: 1;
  height: 8px;
  background: var(--bg);
  border-radius: 4px;
  overflow: hidden;
}
.weakness-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.3s ease;
}
.weakness-val { width: 30px; text-align: right; font-size: 12px; font-weight: 600; }

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
  overflow-x: auto;
}
.tab {
  padding: 8px 16px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
  white-space: nowrap;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

/* Buttons */
.btn {
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { background: var(--bg-hover); }
.btn-primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 500; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* Loading / Error / Empty */
.state-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
}
.state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.state-text { font-size: 14px; color: var(--text-dim); margin-bottom: 16px; }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Overlay for mobile sidebar */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 90;
}
.overlay.show { display: block; }

/* Back button */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 16px;
  background: none;
  border: none;
  padding: 4px 0;
}
.back-btn:hover { color: var(--accent); }

/* Weapon tree */
.tree-node {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 4px;
  cursor: pointer;
  font-size: 13px;
  transition: all var(--transition);
}
.tree-node:hover { border-color: var(--accent); }
.tree-node.current { border-color: var(--accent); background: rgba(245,158,11,0.1); }
.tree-children { margin-left: 20px; border-left: 2px solid var(--border); padding-left: 12px; }

/* Armor set builder */
.set-builder {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 20px;
}
.set-slots { display: flex; flex-direction: column; gap: 8px; }
.set-slot {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  cursor: pointer;
  transition: all var(--transition);
}
.set-slot:hover { border-color: var(--accent); }
.set-slot .slot-label { font-size: 11px; color: var(--text-muted); }
.set-slot .slot-value { font-size: 13px; font-weight: 500; margin-top: 2px; }
.set-slot.empty .slot-value { color: var(--text-muted); font-style: italic; }

/* Skill result */
.skill-result {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.skill-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.skill-row:last-child { border-bottom: none; }
.skill-name { font-weight: 500; }
.skill-pts { color: var(--accent); font-weight: 600; }
.skill-active { color: var(--success); }
.skill-inactive { color: var(--text-muted); }

/* Collection / Favorites */
.collection-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
}
.collection-item .qty-input {
  width: 60px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
  text-align: center;
}
.progress-bar {
  height: 6px;
  background: var(--bg);
  border-radius: 3px;
  overflow: hidden;
  flex: 1;
}
.progress-fill {
  height: 100%;
  background: var(--success);
  border-radius: 3px;
  transition: width 0.3s;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-width: 500px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h3 { font-size: 16px; }
.modal-close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 20px;
  cursor: pointer;
}
.modal-body { padding: 20px; }
.modal-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* Toast */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 400;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 16px;
  font-size: 13px;
  box-shadow: var(--shadow);
  animation: slideIn 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--info); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Responsive */
@media (max-width: 1024px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .menu-btn { display: block; }
  .search-box { width: 200px; }
  .set-builder { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .content { padding: 16px; }
  .detail-header { flex-direction: column; }
  .detail-icon { width: 60px; height: 60px; font-size: 30px; }
  .detail-title { font-size: 22px; }
  .search-box { width: 140px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .filters { gap: 6px; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .page-title { font-size: 20px; }
}

/* Focus styles for accessibility */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Utility */
.flex { display: flex; }
.flex-wrap { flex-wrap: wrap; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; }
.mb-3 { margin-bottom: 12px; }
.text-dim { color: var(--text-dim); }
.text-muted { color: var(--text-muted); }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.fw-600 { font-weight: 600; }
.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hidden { display: none !important; }
.w-full { width: 100%; }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Overlay for mobile -->
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">MH</div>
      <h1 id="appTitle">MHGU Database</h1>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <select class="lang-select" id="langSelect" onchange="setLang(this.value)">
        <option value="zh">简体中文</option>
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
      <span style="flex:1"></span>
      <span class="text-xs text-muted" id="versionLabel">v0.1.0</span>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="header">
      <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="header-spacer"></div>

  ]},
];

function t(key) {
  return I18N[currentLang]?.[key] || I18N.en[key] || key;
}

function getName(item) {
  if (!item) return '';
  if (currentLang === 'zh' && item.name_zh) return item.name_zh;
  if (currentLang === 'ja' && item.name_ja) return item.name_ja;
  return item.name || '';
}

// ==================== Router ====================
function navigate(page, params = {}) {
  currentRoute = { page, params };
  let hash = '#/' + page;
  if (params.id) hash += '/' + params.id;
  if (params.tab) hash += '?tab=' + params.tab;
  history.pushState(null, '', hash);
  render();
}

function parseHash() {
  const hash = location.hash || '#/home';
  const parts = hash.replace('#/', '').split('/');
  const page = parts[0] || 'home';
  const params = {};
  if (parts[1]) {
    const [id, query] = parts[1].split('?');
    params.id = id;
    if (query) {
      query.split('&').forEach(p => {
        const [k, v] = p.split('=');
        params[k] = v;
      });
    }
  }
  return { page, params };
}

window.addEventListener('popstate', () => {
  currentRoute = parseHash();
  render();
});

// ==================== Search ====================
function setupSearch() {
  const input = document.getElementById('globalSearch');
  const results = document.getElementById('searchResults');
  input.placeholder = t('search');
  
  let debounceTimer;
  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      const q = input.value.trim().toLowerCase();
      if (!q) { results.classList.remove('show'); return; }
      performSearch(q);
    }, 200);
  });
  
  input.addEventListener('focus', () => {
    if (input.value.trim()) performSearch(input.value.trim().toLowerCase());
  });
  
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-box')) results.classList.remove('show');
  });
  
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { results.classList.remove('show'); input.blur(); }
  });
}

function performSearch(q) {
  const results = document.getElementById('searchResults');
  const matches = [];
  const categories = ['monsters', 'weapons', 'armor', 'decorations', 'items', 'quests', 'maps', 'skillTrees'];
  
  categories.forEach(cat => {
    const data = MOCK_DATA[cat] || [];
    data.forEach(item => {
      const name = getName(item).toLowerCase();
      const enName = (item.name || '').toLowerCase();
      if (name.includes(q) || enName.includes(q)) {
        matches.push({ ...item, _category: cat });
      }
    });
  });
  
  if (matches.length === 0) {
    results.innerHTML = `<div class="search-no-result">${t('noResults')}</div>`;
  } else {
    results.innerHTML = matches.slice(0, 20).map(m => {
      const catLabel = t(MOCK_DATA[m._category] ? m._category : m._category);
      return `<div class="search-result-item" onclick="navigate('${m._category}', {id: ${m.id}});document.getElementById('searchResults').classList.remove('show');document.getElementById('globalSearch').value='';">
        <span class="cat-badge">${catLabel}</span>
        <span>${getName(m)}</span>
      </div>`;
    }).join('');
  }
  results.classList.add('show');
}

// ==================== Language ====================
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('mhgu_lang', lang);
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang === 'ja' ? 'ja' : 'en';
  render();
}

// ==================== Render ====================
function render() {
  renderSidebar();
  renderBreadcrumb();
  
  const content = document.getElementById('content');
  const { page, params } = currentRoute;
  
  // Simulate loading
  content.innerHTML = `<div class="state-container"><div class="spinner"></div><div class="state-text">${t('loading')}</div></div>`;
  
  setTimeout(() => {
    switch(page) {
      case 'home': renderHome(content); break;
      case 'monsters': params.id ? renderMonsterDetail(content, params.id) : renderMonsterList(content); break;
      case 'weapons': params.id ? renderWeaponDetail(content, params.id) : renderWeaponList(content); break;
      case 'armor': params.id ? renderArmorDetail(content, params.id) : renderArmorList(content); break;
      case 'decorations': params.id ? renderDecoDetail(content, params.id) : renderDecoList(content); break;
      case 'items': params.id ? renderItemDetail(content, params.id) : renderItemList(content); break;
      case 'quests': params.id ? renderQuestDetail(content, params.id) : renderQuestList(content); break;
      case 'maps': params.id ? renderMapDetail(content, params.id) : renderMapList(content); break;
      case 'skillTrees': params.id ? renderSkillDetail(content, params.id) : renderSkillList(content); break;
      case 'palico': renderPalico(content); break;
      case 'crafting': renderCrafting(content); break;
      case 'setBuilder': renderSetBuilder(content); break;
      case 'favorites': renderFavorites(content); break;

    }
  }, 150);
}

function renderSetBuilder(el) {
  const saved = JSON.parse(localStorage.getItem('mhgu_sets') || '[]');

      <p class="text-sm text-dim">ℹ️ ${t('localDataNotice')}</p>
    </div>
    <div class="flex gap-2 mb-4">
      <button class="btn btn-primary" onclick="createNewSet()">+ ${t('create')}</button>
      <button class="btn" onclick="exportSets()">${t('export')}</button>

    </div>
    
    ${saved.length === 0 ? `
      <div class="state-container">

      <div class="grid grid-2">
        ${saved.map((set, i) => `
          <div class="card">
            <div class="flex justify-between items-center mb-3">
              <div class="fw-600">${set.name}</div>
              <div class="flex gap-2">
                <button class="btn btn-sm" onclick="editSet(${i})">${t('edit')}</button>
                <button class="btn btn-sm btn-danger" onclick="deleteSet(${i})">${t('delete')}</button>
              </div>
            </div>
            <div class="set-slots">
              ${['weapon','head','body','arms','waist','legs','talisman'].map(slot => `
                <div class="set-slot ${set.equipment?.[slot] ? '' : 'empty'}">
                  <div class="slot-label">${t(slot)}</div>
                  <div class="slot-value">${set.equipment?.[slot] ? getName(MOCK_DATA.armor.find(a => a.id == set.equipment[slot]) || {}) || set.equipment[slot] : 'Empty'}</div>
                </div>
              `).join('')}
            </div>
            <div class="mt-3">
              <div class="section-title" style="font-size:13px;margin-bottom:8px">🌳 ${t('skillResult')}</div>
              <div class="skill-result">
                ${Object.entries(set.skills || {}).map(([sid, pts]) => {
                  const st = MOCK_DATA.skillTrees.find(s => s.id == sid);
                  if (!st) return '';
                  const active = st.thresholds.filter(th => th.pts <= pts).pop();
                  return `<div class="skill-row">
                    <span class="skill-name">${getName(st)}</span>
                    <span class="skill-pts">${pts > 0 ? '+' : ''}${pts}</span>
                    <span class="${active ? 'skill-active' : 'skill-inactive'}">${active ? active.skill : '-'}</span>
                  </div>`;

          </div>
        `).join('')}

    `}
  `;
}

function createNewSet() {

function saveNewSet() {

  sets.push({ name, equipment: {}, skills: {}, created: Date.now() });

function editSet(idx) {
  const sets = JSON.parse(localStorage.getItem('mhgu_sets') || '[]');
  const set = sets[idx];
  openModal(t('edit') + ': ' + set.name, `
    <div class="mb-3">
      <label class="text-sm text-dim">${t('name')}</label>
      <input type="text" id="editSetName" class="filter-input w-full mt-2" value="${set.name}">
    </div>
    <div class="mb-3">
      <label class="text-sm text-dim">${t('head')}</label>
      <select id="editSetHead" class="filter-input w-full mt-2">
        <option value="">- Empty -</option>
        ${MOCK_DATA.armor.filter(a => a.type === 'head').map(a => `<option value="${a.id}" ${set.equipment?.head == a.id ? 'selected' : ''}>${getName(a)}</option>`).join('')}
      </select>
    </div>
    <div class="mb-3">
      <label class="text-sm text-dim">${t('body')}</label>
      <select id="editSetBody" class="filter-input w-full mt-2">
        <option value="">- Empty -</option>
        ${MOCK_DATA.armor.filter(a => a.type === 'body').map(a => `<option value="${a.id}" ${set.equipment?.body == a.id ? 'selected' : ''}>${getName(a)}</option>`).join('')}
      </select>
    </div>
  `, [
    { label: t('cancel'), action: 'closeModal()' },
    { label: t('save'), action: `saveEditSet(${idx})`, primary: true },
  ]);
}

function saveEditSet(idx) {
  const sets = JSON.parse(localStorage.getItem('mhgu_sets') || '[]');
  sets[idx].name = document.getElementById('editSetName').value.trim() || sets[idx].name;
  sets[idx].equipment = sets[idx].equipment || {};
  sets[idx].equipment.head = document.getElementById('editSetHead').value;
  sets[idx].equipment.body = document.getElementById('editSetBody').value;
  
  // Recalculate skills
  const skills = {};
  ['head', 'body'].forEach(slot => {
    const aid = sets[idx].equipment[slot];
    if (aid) {
      const armor = MOCK_DATA.armor.find(a => a.id == aid);
      if (armor?.skills) {
        Object.entries(armor.skills).forEach(([sid, pts]) => {
          skills[sid] = (skills[sid] || 0) + pts;
        });
      }
    }
  });
  sets[idx].skills = skills;
  
  try {
    localStorage.setItem('mhgu_sets', JSON.stringify(sets));
    closeModal();
    showToast(t('save') + ' ✓', 'success');
    render();
  } catch(e) {
    showToast(t('saveFailed'), 'error');
  }
}

function deleteSet(idx) {
  openModal(t('delete'), `<p>${t('deleteConfirm')}</p>`, [
    { label: t('cancel'), action: 'closeModal()' },
    { label: t('delete'), action: `confirmDeleteSet(${idx})`, primary: false, danger: true },
  ]);
}

function confirmDeleteSet(idx) {
  const sets = JSON.parse(localStorage.getItem('mhgu_sets') || '[]');
  sets.splice(idx, 1);
  localStorage.setItem('mhgu_sets', JSON.stringify(sets));
  closeModal();
  showToast(t('delete') + ' ✓', 'success');
  render();
}

function exportSets() {
  const data = localStorage.getItem('mhgu_sets') || '[]';
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mhgu_sets_backup.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast(t('exportSuccess'), 'success');
}

function importSets() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw new Error('Invalid format');
        localStorage.setItem('mhgu_sets', JSON.stringify(data));
        showToast(t('importSuccess'), 'success');
        render();
      } catch(err) {
        showToast(t('importFailed'), 'error');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ==================== Modal ====================
function openModal(title, body, buttons = []) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFooter').innerHTML = buttons.map(b => 
    `<button class="btn ${b.primary ? 'btn-primary' : ''} ${b.danger ? 'btn-danger' : ''}" onclick="${b.action}">${b.label}</button>`
  ).join('');
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModal();
    document.getElementById('searchResults').classList.remove('show');
  }
});

// ==================== Toast ====================
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    toast.style.transition = '0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

}
